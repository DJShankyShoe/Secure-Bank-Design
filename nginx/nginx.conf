events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cloudflare tunnel runs as a systemd service on this host,
    # so it connects from 127.0.0.1 — trust CF-Connecting-IP from there.
    real_ip_header    CF-Connecting-IP;
    set_real_ip_from  127.0.0.1;

    limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=20r/m;
    limit_req_zone $binary_remote_addr zone=mfa_zone:10m      rate=10r/m;
    limit_req_zone $binary_remote_addr zone=register_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=email_zone:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=transfer_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m      rate=60r/m;

    client_max_body_size  1m;
    client_header_timeout 10s;
    client_body_timeout   10s;
    keepalive_timeout     30s;
    send_timeout          10s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Backend containers run on host network at these ports.
    upstream securebank_backend {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    }

    server {
        # Only listen on loopback — Cloudflare tunnel connects here.
        listen 127.0.0.1:80;
        root  /usr/share/nginx/html;
        index index.html;

        limit_conn conn_limit 20;

        location /auth/login/mfa {
            limit_req zone=mfa_zone burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /auth/register/verify-totp {
            limit_req zone=mfa_zone burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /auth/unlock/verify {
            limit_req zone=mfa_zone burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /auth/email/verify {
            limit_req zone=mfa_zone burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /auth/register {
            limit_req zone=register_zone burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /auth/unlock/request {
            limit_req zone=email_zone burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /auth/email {
            limit_req zone=email_zone burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /transactions/transfer {
            limit_req zone=transfer_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /transactions/bill-payment {
            limit_req zone=transfer_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /auth/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location = /accounts {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /accounts/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /admin/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /superadmin/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /transactions/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /healthz {
            proxy_pass http://securebank_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
