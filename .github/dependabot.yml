version: 2
updates:
  # Backend (Python) dependencies — pinned exact versions per CLAUDE.md SR-07.
  # Grouped into one PR per week instead of one per package.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      backend-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "backend"

  # Frontend (npm) dependencies.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "frontend"

  # GitHub Actions used across all workflow files (the SHA-pinned actions/*,
  # appleboy/ssh-action, dependency-check/*, etc).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
