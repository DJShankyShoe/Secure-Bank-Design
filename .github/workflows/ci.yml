name: CI

# ---------------------------------------------------------------------------
# Pipeline security follows the OWASP CI/CD Security Cheat Sheet:
#   * Least-privilege GITHUB_TOKEN — deny-by-default `permissions: contents: read`
#     at the top level; jobs opt into more only if they need it (none do here).
#   * Third-party actions pinned to a full commit SHA (not a moving tag/branch),
#     with the human-readable version in a trailing comment.
#   * Untrusted event input is never interpolated into `run:` shell (injection).
#   * SAST (Bandit + Semgrep), SCA (Dependency-Check + npm audit) and secret
#     scanning (Gitleaks) run in the pipeline.
#
# This file is an ORCHESTRATOR ONLY: each job below delegates its real work to
# a separate reusable workflow file via `uses:` (frontend-build.yml,
# backend-tests.yml, dependency-check.yml, sast-semgrep.yml,
# secret-scan-gitleaks.yml, dast-zap.yml, e2e-playwright.yml,
# deploy-production.yml, deploy-test.yml — all in this same directory).
# Splitting into files is
# purely for Actions-sidebar clarity — `needs:` still only works within one
# file, so this file is what keeps the hard gate intact: `deploy` and
# `deploy-test` still cannot start until every job they `needs` has
# succeeded, exactly as before the split.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - production
      - Frontend
      - backend
      - integration-test

  pull_request:
    branches:
      - production
      - integration-test

  workflow_dispatch:        # manual "Run workflow" button (also runs the deploy gate)

# Deny-by-default token scope for every job (OWASP: least privilege).
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    uses: ./.github/workflows/frontend-build.yml

  backend:
    name: Backend Tests
    uses: ./.github/workflows/backend-tests.yml

  dependency-check:
    name: Dependency Check
    uses: ./.github/workflows/dependency-check.yml

  sast:
    name: SAST (Semgrep)
    uses: ./.github/workflows/sast-semgrep.yml

  secret-scan:
    name: Secret Scan (Gitleaks)
    uses: ./.github/workflows/secret-scan-gitleaks.yml

  dast:
    name: DAST (OWASP ZAP baseline)
    uses: ./.github/workflows/dast-zap.yml

  e2e:
    name: E2E (Playwright)
    uses: ./.github/workflows/e2e-playwright.yml

  # ---------------------------------------------------------------------------
  # CD — deploy to the production EC2 host, but ONLY after CI passes.
  #   * needs: [...] -> deploys ONLY if build/tests AND every security gate
  #     went green (SCA, Semgrep SAST, Gitleaks secret scan, ZAP DAST, and the
  #     full Playwright E2E suite — real registration/login/transfer/RBAC
  #     flows against a live app, not just unit-level coverage).
  #   * if: only on a push/manual-run of the production branch (so pushes to
  #     integration-test/Frontend/backend and all PRs never deploy here —
  #     integration-test has its own deploy-test job below, targeting a
  #     separate test EC2 host).
  #   * secrets: passes only the three secrets deploy-production.yml actually
  #     needs (least privilege — Semgrep's yaml.github-actions.security.
  #     secrets-inherit rule flags `secrets: inherit` here since it would hand
  #     the called workflow every repo secret, including TEST_*). The script
  #     itself never touches untrusted event input, so there is no
  #     script-injection surface either (OWASP CI/CD).
  # Required repo secrets: EC2_HOST, EC2_USERNAME, EC2_SSH_KEY (production);
  # TEST_HOST, TEST_USERNAME, TEST_SSH_KEY (integration-test test host, see
  # deploy-test below).
  # Server prereqs (one-time, not done here): repo cloned at ~/Secure-Bank-Design,
  # backend/.env + DB provisioned, ssh user in the `docker` group, CF tunnel up.
  # NOTE (optional hardening): to require manual approval before a production
  # deploy, add `environment: production` here and configure required
  # reviewers under Settings -> Environments (see SETTINGS_CHECKLIST.md).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production EC2
    needs: [frontend, backend, dependency-check, sast, secret-scan, dast, e2e]
    if: >-
      github.ref == 'refs/heads/production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    # Serialise deploys; let an in-flight one finish rather than cancel it.
    concurrency:
      group: cd-production
      cancel-in-progress: false

    uses: ./.github/workflows/deploy-production.yml
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

  # ---------------------------------------------------------------------------
  # CD — deploy to the test EC2 host (Ubuntu, no nginx/Cloudflare), but ONLY
  # after CI passes. Same gating as deploy above; independent concurrency
  # group so a test deploy never queues behind or blocks a production deploy.
  #   * NOTE: this job is gated on integration-test and can never fire on a
  #     push to production (github.ref check below) — it is present here only
  #     so ci.yml stays IDENTICAL on both branches, which is what keeps future
  #     integration-test -> production merges conflict-free. Do not delete
  #     this job from the production branch; it is inert here by design, not
  #     dead code.
  # ---------------------------------------------------------------------------
  deploy-test:
    name: Deploy to Test EC2
    needs: [frontend, backend, dependency-check, sast, secret-scan, dast, e2e]
    if: >-
      github.ref == 'refs/heads/integration-test' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    concurrency:
      group: cd-test
      cancel-in-progress: false

    uses: ./.github/workflows/deploy-test.yml
    secrets:
      TEST_HOST: ${{ secrets.TEST_HOST }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
