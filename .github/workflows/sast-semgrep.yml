name: SAST (Semgrep)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # BLOCKING: Semgrep findings fail this job (via --error), and the deploy job
    # `needs` it — so OWASP/Python/JS findings stop a push from deploying.

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        # setuptools ships pkg_resources, which Semgrep 1.97.0's bundled
        # opentelemetry-instrumentation imports at startup. Python 3.12 no longer
        # installs setuptools by default, so add it explicitly or Semgrep crashes
        # with "ModuleNotFoundError: No module named 'pkg_resources'".
        run: pip install "setuptools<81" semgrep==1.97.0

      # Rulesets cover OWASP Top Ten plus language-specific checks for the Python
      # backend and the JavaScript/React frontend. --error sets a non-zero exit on
      # findings, which now fails the job and blocks the deploy (this job gates).
      #
      # --exclude nginx: this SAST targets the app code (Python/JS). The nginx
      # reverse-proxy config is infra (out of backend scope) and only tripped the
      # generic "request-host-used" rule on the standard `proxy_set_header Host
      # $host;` idiom — not exploitable here (nginx listens on loopback behind a
      # Cloudflare tunnel with no server_name, and the app builds all links from
      # FRONTEND_BASE_URL, never the request Host header).
      - name: Semgrep scan (OWASP Top Ten + Python + JavaScript)
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/python
          --config p/javascript
          --exclude nginx
          --error
          --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
